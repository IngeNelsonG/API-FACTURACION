[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-facturacion-dian"
version = "0.1.0"
description = "API de facturación electrónica conectada a los servicios web de la DIAN (Colombia)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9,<3",
    "lxml>=5.2",
    "signxml>=4.0,<6",
    "cryptography>=43",
    "httpx>=0.27,<1",
    "reportlab>=4.2",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facturacion = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["facturacion"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
# N818: las excepciones usan nombres en español ("ErrorDian"), no el sufijo "Error".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# assert y credenciales ficticias son normales en los tests.
"tests/**" = ["S101", "S105", "S106"]
