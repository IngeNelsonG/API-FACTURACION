name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint y formato
        run: |
          ruff check src tests migraciones
          ruff format --check src tests migraciones
      - name: Tests con cobertura
        run: pytest --cov --cov-report=term --cov-fail-under=85
      - name: Migraciones aplican y revierten
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Auditoría de dependencias
        run: pip-audit --skip-editable
