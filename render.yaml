# Blueprint de despliegue en Render (100% Free Tier)
# Cumple NU01 (HTTPS), NU02 (PostgreSQL persistente), NU03 (secretos separados) y NU04 (CORS)

databases:
  - name: alba-facturacion-g5-db
    databaseName: facturacion
    user: facturacion_user
    plan: free

services:
  # 1. Backend Flask Dockerizado con Gunicorn
  - type: web
    name: alba-facturacion-g5-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alba-facturacion-g5-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://alba-facturacion-g5-web.onrender.com

  # 2. Frontend React (Vite) como Static Site gratuito (sin spin-down)
  - type: web
    name: alba-facturacion-g5-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: alba-facturacion-g5-api
          envVarKey: RENDER_EXTERNAL_URL

