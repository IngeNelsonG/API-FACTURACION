# Entorno local: API + PostgreSQL + Mailpit (bandeja de correo de pruebas en http://localhost:8025).
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://facturacion:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/facturacion
      CORREO_MODO: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_STARTTLS: "false"
      MAIL_SMTP_AUTH: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./certificados:/app/certificados:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: facturacion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  datos-db:
